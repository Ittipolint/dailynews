# DailyNews Nginx site config
# Target: https://ittipolint-sbu.veya.co.th/dailynews (sub-path)

# Sub-path deployment under existing vhost.
# The main site already maps to /var/www; DailyNews app is at /dailynews
# Adjust the following location block inside your existing server{} for ittipolint-sbu.veya.co.th:

# ================================================================
# Example: add to the existing vhost for ittipolint-sbu.veya.co.th
# ================================================================
#
# location ^~ /dailynews {
#     alias /var/www/dailynews/webapp/public;
#     try_files $uri $uri/ @dailynews;
#
#     location ~ ^/dailynews/.*\.php$ {
#         alias /var/www/dailynews/webapp/public;
#         fastcgi_pass unix:/run/php/php8.3-fpm.sock;
#         fastcgi_index index.php;
#         include fastcgi_params;
#         fastcgi_param SCRIPT_FILENAME $request_filename;
#         fastcgi_param APP_BASE_PATH /dailynews;
#     }
#
#     location @dailynews {
#         rewrite ^/dailynews/(.*)$ /dailynews/index.php?/$1 last;
#     }
# }
#
# ================================================================
# Standalone config below can be used if DailyNews gets its own vhost.
# ================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ittipolint-sbu.veya.co.th;

    root /var/www/dailynews/webapp/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
