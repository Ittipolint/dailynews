services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dailynews-web
    working_dir: /var/www/html
    volumes:
      - ../webapp:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/dailynews.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-production}
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dailynews

  nginx:
    image: nginx:1.27-alpine
    container_name: dailynews-nginx
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ../webapp:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - dailynews

  mysql:
    image: mysql:8.4
    container_name: dailynews-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dailynews}
      MYSQL_USER: ${DB_USERNAME:-dailynews}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dailynews}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-10203040}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dailynews

  postgres:
    image: pgvector/pgvector:pg16
    container_name: dailynews-postgres
    environment:
      POSTGRES_DB: ${PGSQL_DATABASE:-ittipolint_dailynews}
      POSTGRES_USER: ${PGSQL_USERNAME:-ittipolint_dailynews}
      POSTGRES_PASSWORD: ${PGSQL_PASSWORD:-dailynews}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGSQL_USERNAME:-ittipolint_dailynews} -d ${PGSQL_DATABASE:-ittipolint_dailynews}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dailynews

  redis:
    image: redis:7-alpine
    container_name: dailynews-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dailynews

  n8n:
    image: n8nio/n8n:latest
    container_name: dailynews-n8n
    environment:
      - N8N_HOST=${N8N_HOST:-n8n38-sbu.veya.co.th}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://n8n38-sbu.veya.co.th/}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_DATABASE:-n8n}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-n8n}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-dailynews-n8n-encryption-key-change-me}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_JWT_SECRET:-dailynews-n8n-jwt-secret-change-me}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/workflows
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dailynews

  metabase:
    image: metabase/metabase:v0.50.16
    container_name: dailynews-metabase
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=${METABASE_DB:-metabase}
      - MB_DB_PORT=5432
      - MB_DB_USER=${METABASE_USER:-metabase}
      - MB_DB_PASS=${METABASE_PASS:-metabase}
      - MB_DB_HOST=postgres
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase.db
    networks:
      - dailynews

volumes:
  mysql_data:
  postgres_data:
  redis_data:
  n8n_data:
  metabase_data:

networks:
  dailynews:
    driver: bridge
